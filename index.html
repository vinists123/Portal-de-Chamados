<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Dados & Insights - Facilities</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="avisoArquivo" style="display:none;background:#D92D20;color:#fff;text-align:center;padding:14px;font-size:15px">
  ⚠ Você abriu o arquivo direto. Assim o portal fica em <b>modo teste</b> (sem e-mail e sem base compartilhada).<br>
  <a href="http://localhost:8080" style="color:#fff;font-weight:700;font-size:17px">👉 Clique aqui para abrir o portal correto: http://localhost:8080</a>
  <div style="font-size:12.5px;opacity:.9;margin-top:4px">Se não abrir, ligue antes o <b>iniciar_portal.bat</b>.</div>
</div>
<div class="login-bg">
  <button class="btn-tema login-tema" onclick="alternarTema()"></button>
  <div class="login-card">
    <div class="login-topo">
      <div class="logo">amil</div>
      <div class="sub">Portal de Demandas · Dados &amp; Insights - Facilities</div>
      <div class="login-faixa"><span style="background:var(--lav)"></span><span style="background:#fff"></span><span style="background:var(--teal)"></span><span style="background:var(--ouro)"></span></div>
    </div>
    <form class="login-corpo" id="frmLogin" onsubmit="return false">
      <div id="lgAviso" style="display:none;background:#FFF4E5;color:#8A4B00;border:1px solid #F5C27A;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px;text-align:center"></div>
      <div class="campo"><label for="lgLogin">Login de rede</label>
        <div class="ico-inp"><span>👤</span><input id="lgLogin" autocomplete="username" placeholder="ex.: vi37114368" autofocus></div></div>
      <div class="campo"><label for="lgSenha">Senha de rede</label>
        <div class="ico-inp"><span>🔒</span><input id="lgSenha" type="password" autocomplete="current-password" placeholder="A mesma senha do seu computador"></div></div>
      <button class="btn" id="btnEntrar" type="submit">Entrar</button>
      <div class="login-erro" id="lgErro"></div>
      <div class="login-dica" id="lgDica"></div>
      <noscript><div class="aviso-js">Ative o JavaScript do navegador para usar o portal.</div></noscript>
    </form>
  </div>
</div>
<div id="modal"></div>
<script src="assets/dados.js"></script>
<script>
if (!MODO_REDE) document.getElementById("avisoArquivo").style.display = "block";
$("#lgDica").textContent = MODO_REDE ? "Use o mesmo login e senha do Windows · a sessão dura 2 horas" : "Modo teste local";
const q = new URLSearchParams(location.search), aviso = $("#lgAviso");
if (q.has("expirou")) { aviso.textContent = "⏱ Sua sessão expirou. Entre novamente com sua senha de rede."; aviso.style.display = "block"; }
if (q.has("saiu")) { aviso.textContent = "Você saiu do portal com segurança."; aviso.style.display = "block"; }
function destino(u) { return u.is_admin ? "quadro.html" : "formulario.html"; }
/* já logado e ainda dentro das 2 h? entra direto */
try {
  const s = sessao();
  if (s && MODO_REDE) {
    const r = reqSinc("GET", "api/sessao");
    if (r.status === 200) location.href = destino(s); else gravarSessao(null);
  }
} catch (e) { gravarSessao(null); }
$("#btnEntrar").onclick = () => {
  $("#lgErro").textContent = "";
  const b = $("#btnEntrar"); b.disabled = true; b.textContent = "Validando senha...";
  setTimeout(() => {
    try {
      const u = entrar($("#lgLogin").value, $("#lgSenha").value);
      if (!u.email || u.nome === u.matricula) abrirPerfil(true, s => location.href = destino(comFlags(s)));
      else location.href = destino(u);
    } catch (e) { $("#lgErro").textContent = e.message; $("#lgSenha").value = ""; $("#lgSenha").focus(); }
    b.disabled = false; b.textContent = "Entrar";
  }, 30);
};
</script>
</body>
</html>
